phase_id = "P3-relational-time"
milestone_id = "M4_5-uow-overhaul"
base_branch = "uow/BND-P2-02"
bundles = [
  { id = "BND-P3-01", parent = "uow/BND-P2-02", summary = "Compact Main §4 relational time (06_wave_state_relational_time.typ) binding tick/click and continuity cleanly to cut-indexed wave states" },
  { id = "BND-P3-02", parent = "BND-P3-01", summary = "Upgrade RC-037 temporal/SI-bridge & causal intervention engine in Python S2 + Rust S4 (zero hardcoded ratios/CSV rows) and fix broken manual2/scripts reference" },
