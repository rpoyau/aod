[objective]
summary = "Refactor Manual §3 (00_awareness_fixtures.typ), §4 (00_dec_ledger.typ), and §8 (03_short_window_rcd_shedding_fixtures.typ) in place into clean General Mechanics structure, fix all scrambled vector IDs (RC-025/026/030/038/045), retire the frozen nested-path contradiction in §8, replace B|t cut-frame notation with B|k in §4, and bind live engine CSV tables."
deliverables = [
  "Refactor typst/manual/sections/00_dec_ledger.typ (§4) in place: fix scrambled vector citations from RC-028/RC-029 to RC-025 (dec_chiral_flip_walk) and RC-026 (dec_two_carrier_chiral_stokes), cite RC-045 (ternary_swar_and_trit_ratio) for the 2-bit preserved-11 (0_D/0_H) ternary encoding, replace unbound cut-frame B|t with cut index B|k (retaining exact labels and meaning), tighten prose into crisp General Mechanics Setup-Derivation-Specialization-Falsification flow, and preserve EVERY existing label and exact #mainequation / #mainsection set/count",
  "Refactor typst/manual/sections/00_awareness_fixtures.typ (§3) in place: tighten prose into crisp General Mechanics structure integrating RC-034 seamlessly, bind <tab:manual-awareness-dec-ledger> live to manual/data/boundary_sadar/awareness_operativity_dec_walk.csv, and preserve EVERY existing label, EVERY owned equation formula in OWNERSHIP_AND_FIXTURES.json and AWARENESS_ACTIVE_CAUSAL_SPEC.json verbatim, and the exact #mainequation / #mainsection set/count",
  "Refactor typst/manual/sections/03_short_window_rcd_shedding_fixtures.typ (§8) in place: retire the self-contradictory sentence claiming 'still needs a frozen nested-path generator' by accurately binding RC-030's genuine finite C_6 two-step path-pair enumeration (410 + 38 = 448 in TritWord/TritRatio) while keeping external physical detector/exposure probability laws explicitly separated; fix the scrambled vector citation 'verified alongside RC-029' on L393 to RC-030 alongside RC-038; bind <tab:manual-short-window-dec-ledger> live to manual/data/boundary_sadar/short_window_rcd_dec_ledger.csv; and preserve EVERY existing label and #main* reference count",
  "Visually inspect rendered Manual §3, §4, and §8 pages (specifically every modified table and section boundary) of _build/pub/manual.pdf at 144 ppi PNG via pdftoppm and view_file confirming zero overlaps, zero clipping, and zero margin overflows",
]

[scope]
