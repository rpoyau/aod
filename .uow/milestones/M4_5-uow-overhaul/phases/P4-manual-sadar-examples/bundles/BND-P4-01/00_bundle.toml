  "contracts/scientific/OWNERSHIP_AND_FIXTURES.json",
  "contracts/scientific/AWARENESS_ACTIVE_CAUSAL_SPEC.json",
  "contracts/scientific/CANONICAL_BINDINGS.json",
  "tests/test_main_manual_references.py",
  "tests/test_main_manual_concept_ownership.py",
]
write_set = [
  "typst/manual/sections/00_awareness_fixtures.typ",
  "typst/manual/sections/00_dec_ledger.typ",
  "typst/manual/sections/03_short_window_rcd_shedding_fixtures.typ",
]

[invariants]
inherited = true
bundle_rules = [
  "Zero scrambled vector IDs: §4 must cite RC-025 and RC-026 (plus RC-045), NEVER RC-028/RC-029 for chiral flip/Stokes; §8 must cite RC-030 and RC-038, NEVER RC-029",
  "Zero self-contradictory 'still needs a frozen nested-path generator' claim in §8 (distinguish RC-030's genuine finite C_6 two-step path-pair enumeration cleanly from external physical detector/exposure laws)",
  "Zero B|t cut-frame notation in §4 (use cut index B|k)",
  "Preserve ALL 455 Main labels, ALL 281 Manual labels, ALL 172 Manual mainref_uses, EVERY owned equation formula in OWNERSHIP_AND_FIXTURES.json / AWARENESS_ACTIVE_CAUSAL_SPEC.json byte-for-byte, and the EXACT #mainequation / #mainsection sets in 00_awareness_fixtures.typ and 00_dec_ledger.typ so test_main_manual_references.py and test_main_manual_concept_ownership.py pass 100%",
  "Zero text collisions, clipping, or margin overflows on rendered Manual §3, §4, and §8 pages at 144 ppi PNG",
]

[validation]
commands = [
  "python3 -B scripts/audit_scientific_sources.py .",
  "PATH=\"$HOME/.local/bin:$PATH\" python3 -B scripts/build_publication.py --outdir _build/pub --check-registry",
  "python3 -B -m pytest -q tests/test_active_scientific_sources.py tests/test_mathematical_bindings.py tests/test_main_manual_references.py tests/test_main_manual_concept_ownership.py",
]
max_retries = 2
