[invariants]
inherited = true
bundle_rules = [
  "Zero floats, zero complex, zero bare assert, zero Fraction in RC-044 (manual_dec_examples.py); 100% std-only #![forbid(unsafe_code)] zero-BigRat in op_dec_coordinate_phase_3d_walk (manual_dec_ops.rs) with RUSTFLAGS='-D warnings' clean",
  "RC-044 canonical default (beta_a=5, octant_bit_order='msb_x') must match RC-012 (manual/data/brownian/octant_delta3.csv) exactly on phase_DeltaZ, octant_DeltaZ, sum_phase_m, sum_octant_m, R_Q, R_x, R_y, R_z",
  "Zero stale 'Q mod 4' or 'theta_mod4' in App. C (C_3d_coordinate_phase_cycle_delta3_fixture.typ) or coordinate_phase_3d_dec_walk.csv",
  "Preserve ALL 455 Main labels, ALL 281 Manual labels, ALL 172 Manual mainref_uses, EVERY owned anchor in OWNERSHIP_AND_FIXTURES.json, and exact #main*/#aod-cite inventory across App. A, B, C",
  "S2 normal == S2 -O byte parity, S4 debug == S4 release byte parity, and zero layout collisions/overflows on rendered App. A-C pages at 144 ppi PNG",
]

[validation]
commands = [
  "python3 -B scripts/audit_scientific_sources.py .",
  "PATH=\"$HOME/.local/bin:$PATH\" python3 -B scripts/build_publication.py --outdir _build/pub --check-registry",
  "CARGO_TARGET_DIR=_build/cargo-target RUSTFLAGS=\"-D warnings\" cargo test --manifest-path crates/aod-core/Cargo.toml --offline --locked",
  "mkdir -p _build/s2 _build/s4 && python3 -B -m manual.engine --sector boundary_sadar --check-zero-float --verify-vectors --report _build/s2/p404_norm.json && python3 -B -O -m manual.engine --sector boundary_sadar --check-zero-float --verify-vectors --report _build/s2/p404_opt.json && cmp _build/s2/p404_norm.json _build/s2/p404_opt.json",
  "CARGO_TARGET_DIR=_build/cargo-target cargo run --manifest-path crates/aod-core/Cargo.toml --offline --locked -- --verify-vectors --check-zero-float --report _build/s4/p404_dbg.json && CARGO_TARGET_DIR=_build/cargo-target cargo run --manifest-path crates/aod-core/Cargo.toml --offline --locked --release -- --verify-vectors --check-zero-float --report _build/s4/p404_rel.json && cmp _build/s4/p404_dbg.json _build/s4/p404_rel.json",
  "python3 -B -m pytest -q -k 'not (source_zip or s2_f1_diagnostics or s4_f1 or f1_diagnostics)' tests/test_active_scientific_sources.py tests/test_mathematical_bindings.py tests/test_s2_reference_engine.py tests/test_s4_rust_exact_core.py",
]
