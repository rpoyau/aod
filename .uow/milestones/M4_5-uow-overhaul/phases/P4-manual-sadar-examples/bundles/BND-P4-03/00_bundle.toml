  "Refactor typst/manual/sections/05_solar_system_field_tests.typ (§12): tighten General Mechanics flow around RC-040 (solar_o0_boundary_dec_audit.csv) preserving HOLD_MISSING_NATIVE_SOLAR_PRODUCER and bind the §12 D.E.C. audit table live to solar_o0_boundary_dec_audit.csv",
  "Refactor typst/manual/sections/06_field_dynamics_applications.typ (§13): eliminate ALL stale 64.70291920%, 1523/1521-digit, and non-existent 66.1613% SPARC claims; accurately report the declared G0 SPARC pooled primary exact rational score from sparc_pooled_primary_exact.csv (SD-008: MAPE_U = 26.57055342%, 230-digit numerator over 228-digit denominator across all 209 positive-U^obs bins in TritWord/TritRatio arithmetic, zero free halo fitting); fix scrambled vector IDs (L510 RC-025 -> RC-027 with derived 50-microslot Q_4 x mu rotor; L674 RC-032 -> SD-008 alongside RC-041); retire any stale float/pandas narrative; and bind the §13 D.E.C. run-tumble checkpoint table cleanly against run_tumble_q4_dec_walk.csv",
  "Refactor typst/manual/sections/07_galactic_lensing_plan.typ (§14): tighten General Mechanics flow around RC-020 and RC-042 (lensing_ray_chiral_dec_walk.csv), keep L3/K4 3D+timeflow inputs held at B_SWELLS, and bind the §14 D.E.C. ray walk table live to lensing_ray_chiral_dec_walk.csv",
  "Update typst/manual/sections/09_prediction_test_fixture_registry.typ (§15): align ALL 53 golden vectors (RC-001..RC-045 + SD-001..SD-008) with exact ground-truth operations and CSV artifacts (adding RC-045 ternary_swar_and_trit_ratio and fixing every scrambled RC/SD citation)",
  "Visually verify rendered pages containing every modified table and SPARC/registry block across §1, §11, §12, §13, §14, and §15 of _build/pub/manual.pdf at 144 ppi PNG via pdftoppm and view_file confirming zero overlaps, zero clipping, and zero margin overflows",
