  "Update typst/manual/sections/00_scope.typ (§1): update golden vector range RC-001..RC-044 -> RC-001..RC-045 (53 vectors = 45 rational_core + 8 symbolic_and_display) and fix ALL scrambled vector citations in the 18-unit boundary-stack table (§4: RC-025, RC-026, RC-045; §8: RC-030, RC-038; §9: RC-027--RC-029, SD-007; §10: RC-031, RC-039; §11: RC-032; §13: RC-041, SD-008) while preserving every owned anchor in OWNERSHIP_AND_FIXTURES.json",
