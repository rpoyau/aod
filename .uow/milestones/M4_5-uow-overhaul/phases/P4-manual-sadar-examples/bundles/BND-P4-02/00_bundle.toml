]

[invariants]
inherited = true
bundle_rules = [
  "Zero scrambled vector IDs in §9: ZERO RC-025 and ZERO RC-026 anywhere in 01_rest_energy_prediction.typ; Tau = RC-027, Debris/Higgs saddle = RC-028, 10-carrier atlas = RC-029, Quarantine = SD-007",
  "Zero stale 'raw count 26' in §9; Tau trace must accurately report raw_cuts = 28 = 11 + 17 (symmetry quotient 11 via TritWord.burn_contiguous_dwell) and the derived 50-microslot Q_4 x mu impedance rotor (RD = 9 -> 61 -> 137, capacity 200)",
