  "Bind <tab:manual-tau-five-boundary-trace> live to manual/data/boundary_sadar/tau_five_boundary_sadar_trace.csv in §9, tighten dense narrative into crisp General Mechanics Setup-Derivation-Specialization-Falsification flow, and preserve EVERY existing label, EVERY owned anchor in OWNERSHIP_AND_FIXTURES.json (L112-165), and exact #main* / #aod-cite counts",
  "Refactor typst/manual/sections/02_hydrogen_facing_shell_tests.typ (§10) in place: tighten prose into crisp General Mechanics Setup-Derivation-Specialization-Falsification flow integrating RC-031 (hydrogen_shell_exact_series.csv) and RC-039 (hydrogen_shell_dec_transitions.csv) with clear D0 rational vs quarantined NIST-ASD wavelength separation, bind <tab:manual-hydrogen-dec-transitions> live to manual/data/boundary_sadar/hydrogen_shell_dec_transitions.csv, and preserve EVERY existing label and reference count",
