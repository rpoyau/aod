]

[validation]
commands = [
  "python3 -B scripts/audit_scientific_sources.py .",
  "PATH=\"$HOME/.local/bin:$PATH\" python3 -B scripts/build_publication.py --outdir _build/pub --check-registry",
  "PATH=\"$HOME/.local/bin:$PATH\" python3 -B scripts/typ2tex.py --root . --outdir _build/latex_check",
  "python3 -B -c 'import json; from pathlib import Path; import scripts.verify_typst_parity as vtp; root = Path(\".\"); m = json.loads((root / \"typst/manifest.json\").read_text()); allowed = {e[\"typst_target\"] for e in m[\"active_source_map\"]} | set(m.get(\"diagram_components\", {})) | set(m.get(\"vector_figure_components\", {})) | {p.relative_to(root).as_posix() for p in (root / \"typst/lib/figures\").rglob(\"*.typ\")}; bad = {}; [bad.__setitem__(p.relative_to(root).as_posix(), v) for p in sorted(list((root / \"typst/sections\").glob(\"*.typ\")) + list((root / \"typst/appendices\").glob(\"*.typ\")) + list((root / \"typst/manual/sections\").glob(\"*.typ\")) + list((root / \"typst/manual/appendices\").glob(\"*.typ\")) + list((root / \"typst/manual/tables\").glob(\"*.typ\"))) for v in [vtp._content_policy_violations(p.relative_to(root).as_posix(), p.read_text(encoding=\"utf-8\"), allowed)[0]] if v]; assert not bad, bad; print(\"GATE_A2_ALL_CONTENT_CLEAN\")'",
  "python3 -B -m pytest -q -o python_files=\"test_*.py qa_*.py\" tests/test_active_scientific_sources.py tests/test_mathematical_bindings.py tests/test_main_manual_references.py tests/test_main_manual_concept_ownership.py tests/qa_phase3_relational_time.py tests/qa_phase4_manual_sadar.py",
  "python3 -B -O -m pytest -q -o python_files=\"qa_*.py\" tests/qa_phase3_relational_time.py tests/qa_phase4_manual_sadar.py",
]
max_retries = 2
