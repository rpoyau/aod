bundle_rules = [
  "Zero Gate A2 _content_policy_violations across ALL 48 Main + Manual .typ units (given the complete include allowlist including the 9 P5-01 figures)",
  "ALL 12 Manual D.E.C. tables remain 100% live CSV-backed (via #aod-csv-table reading /manual/data/boundary_sadar/*.csv inside aod_schema.typ; zero hardcoded row copies in Typst sources)",
  "scripts/typ2tex.py cleanly generates the entire LaTeX compatibility tree into _build/latex_check/ with exit 0 and zero Typ2TexError, expanding all 12 #aod-csv-table calls deterministically from live CSVs",
  "Zero weakened negative controls in verify_typst_parity.py (every rejected probe in test_typst_parity.py:84-114 still fails closed, plus arbitrary non-/manual/data/boundary_sadar/*.csv paths in #aod-csv-table are rejected)",
