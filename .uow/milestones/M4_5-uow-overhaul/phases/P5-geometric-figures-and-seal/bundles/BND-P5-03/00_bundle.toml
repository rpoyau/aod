[objective]
summary = "Add trusted declarative #aod-csv-table and #aod-raw-wrap helpers in typst/lib/aod_schema.typ, migrate all 17 Manual sections/appendices to 100% Gate A2 content-policy compliance while preserving live CSV single-source-of-truth bindings, update Phase 3/4 QA live-CSV substring checks if needed, and extend scripts/typ2tex.py + scripts/verify_typst_parity.py so typ2tex.py cleanly converts the entire Typst repository (including live CSV tables) into deterministic LaTeX."
deliverables = [
  "Add trusted declarative #aod-csv-table(...) and #aod-raw-wrap(...) helpers to typst/lib/aod_schema.typ so live CSV tables read csv(\"/manual/data/boundary_sadar/...\", row-type: dictionary) inside the SHA-256-pinned template library without any #let, #show, #for, .. spread, box(), or csv() calls inside content files",
  "Migrate all 12 live-CSV tables and all non-allowlisted raw-wrap/box/table-size constructs across the 17 affected Manual .typ units (14 sections + 3 appendices) to pure declarative #aod-csv-table(...) / #aod-raw-wrap(...) / reviewed table sizes (7.0pt, 7.5pt, 8.0pt, 8.5pt) while preserving ALL 281 Manual labels, ALL 172 Manual mainref_uses, ALL OWNERSHIP_AND_FIXTURES anchors, and ALL scientific prose/equations verbatim",
  "Update scripts/verify_typst_parity.py: fix _typ_balanced to skip $...$ math spans (resolving half-open (0, 30] false-positive), allow declarative aod-csv-table (strictly validated to literal /manual/data/boundary_sadar/*.csv paths), aod-raw-wrap, figref, reviewed table sizes (7.0pt, 7.5pt, 8.0pt, 8.5pt, 9.5pt, 10pt, 12pt, 14pt, 17pt), and table inset without weakening any negative control in test_typst_parity.py",
  "Extend scripts/typ2tex.py to deterministically expand #aod-csv-table(...) directly from the live CSV files on disk into clean LaTeX tabular/tabularx environments, support #aod-raw-wrap(...), #figref(...), reviewed table font sizes (7.0pt, 7.5pt, 8.0pt), and optional table inset:, and verify clean end-to-end typ2tex.py dry-run generation into _build/latex_check/ with zero Typ2TexError",
  "Update live-CSV check helpers in tests/qa_phase3_relational_time.py and tests/qa_phase4_manual_sadar.py if necessary to accept #aod-csv-table(\"/manual/data/boundary_sadar/...\", ...) alongside csv(...) while preserving every single scientific/data assertion",
  "Verify zero Gate A2 _content_policy_violations across ALL 48 Main + Manual content units (modulo manifest include list sealed in BND-P5-04), clean Typst publication build (--check-registry), and clean 144 ppi visual check on representative migrated CSV tables in _build/pub/manual.pdf",
]

