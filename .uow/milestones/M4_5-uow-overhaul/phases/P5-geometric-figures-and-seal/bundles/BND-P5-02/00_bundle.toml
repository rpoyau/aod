  "Fix all stale vector citations and numeric claims across Manual figures: five_boundary_calculation_spine.typ (53/53 RC-001..RC-045 + SD-001..SD-008, TritWord/TritRatio SWAR), tau_five_boundary_sadar_setup.typ (raw 28 = 11 + 17, RC-027 50-microslot rotor), short_window_boundary_feynman.typ (RC-030 C_6 double-slit + RC-038), wire_moving_boundary_feynman.typ (RC-032, zero RC-030/RC-031), field_dynamics_boundary_feynman.typ (230/228-digit, 26.57055342 % live from CSV, SD-008 & RC-041, zero 64.70291920/840-digit/RC-032), registry_engine_coverage_atlas.typ (53 total = 45 RC-001..RC-045 + 8 SD-001..SD-008, Manual 33..45 bar = 13), and qext_quarantine_firewall.typ (SD-007, SD-004/SD-005 & RC-027..RC-029, zero RC-025, clean box (b) e^- right-border breathing room)",
