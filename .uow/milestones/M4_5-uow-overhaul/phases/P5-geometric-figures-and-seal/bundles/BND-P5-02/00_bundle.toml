  "Zero stale text across all typst/lib/figures/manual/*.typ: zero '64.70291920', zero '840-digit', zero 'raw 26', zero 'RC-001..RC-044', zero '52 ' vector count, zero 'RC-030 & RC-031' in wire_moving_boundary_feynman, zero 'RC-032 & RC-041' in field_dynamics_boundary_feynman, zero 'RC-025' in qext_quarantine_firewall",
