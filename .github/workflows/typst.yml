name: typst

on:
  push:
    branches: [ main, m4, m4-typst-s1a, m4-typst-primary-latex-export ]
  pull_request:

jobs:
  typst-parity:
    runs-on: ubuntu-latest
    env:
      TYPST_VERSION: "0.15.1"
      TYPST_TARBALL: "typst-x86_64-unknown-linux-musl.tar.xz"
      TYPST_TARBALL_SHA256: "a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Typst, Latin Modern fonts, XeLaTeX tools, and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-xetex texlive-bibtex-extra texlive-latex-extra fonts-lmodern poppler-utils python3 python3-pip
          curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/${TYPST_TARBALL}" -o "/tmp/${TYPST_TARBALL}"
          echo "${TYPST_TARBALL_SHA256}  /tmp/${TYPST_TARBALL}" | sha256sum -c -
          tar -xf "/tmp/${TYPST_TARBALL}" -C /tmp
          mkdir -p "$HOME/.local/bin"
          install -m 755 "/tmp/typst-x86_64-unknown-linux-musl/typst" "$HOME/.local/bin/typst"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/typst" --version
          python3 -m pip install --upgrade pip
          if [ -f requirements-ci.txt ]; then python3 -m pip install -r requirements-ci.txt; fi
          python3 -m pip install pytest sympy pandas matplotlib pypdf

      - name: Materialize and build immutable 98ddfa0 historical LaTeX baseline PDFs
        run: |
          python3 scripts/materialize_latex_baseline.py --root . --outdir /tmp/aod_baseline_98ddfa0
          (cd /tmp/aod_baseline_98ddfa0 && latexmk -xelatex -interaction=nonstopmode -halt-on-error main.tex)
          (cd /tmp/aod_baseline_98ddfa0 && latexmk -cd -xelatex -interaction=nonstopmode -halt-on-error manual/main.tex)
          cp /tmp/aod_baseline_98ddfa0/manual/main.pdf /tmp/aod_baseline_98ddfa0/manual.pdf
          mkdir -p dist_typst
          cp /tmp/aod_baseline_98ddfa0/main.pdf dist_typst/baseline_main.pdf
          cp /tmp/aod_baseline_98ddfa0/manual.pdf dist_typst/baseline_manual.pdf

      - name: Build canonical Typst primary PDFs and generated LaTeX compatibility PDFs
        run: |
          python3 scripts/build_publication.py --outdir dist_typst --check-registry --with-latex --check-latex

      - name: Verify native Typst and generated LaTeX parity against historical baseline (normal and -O)
        run: |
          python3 scripts/verify_typst_parity.py \
            --outdir dist_typst/parity_norm \
            --baseline-root /tmp/aod_baseline_98ddfa0 \
            --baseline-main-pdf dist_typst/baseline_main.pdf \
            --baseline-manual-pdf dist_typst/baseline_manual.pdf \
            --generated-latex-main-pdf dist_typst/latex/main.pdf \
            --generated-latex-manual-pdf dist_typst/latex/manual.pdf
          python3 -O scripts/verify_typst_parity.py \
            --outdir dist_typst/parity_opt \
            --baseline-root /tmp/aod_baseline_98ddfa0 \
            --baseline-main-pdf dist_typst/baseline_main.pdf \
            --baseline-manual-pdf dist_typst/baseline_manual.pdf \
            --generated-latex-main-pdf dist_typst/latex/main.pdf \
            --generated-latex-manual-pdf dist_typst/latex/manual.pdf > /dev/null
          cmp dist_typst/parity_norm/parity_report.json dist_typst/parity_opt/parity_report.json
          cp dist_typst/parity_norm/parity_report.json dist_typst/parity_report.json

      - name: Run Typst, typ2tex, and release-builder tests (normal and -O)
        run: |
          python3 -m pytest -q tests/test_typst_parity.py tests/test_ci_release_builder.py
          python3 -O -m pytest -q tests/test_typst_parity.py tests/test_ci_release_builder.py

      - name: Verify non-Git source.zip reconstruction for both publication paths from empty latex/
        run: |
          python3 - <<'EOF'
          import importlib.util, pathlib, shutil, subprocess, tempfile, zipfile
          root = pathlib.Path(".").resolve()
          spec = importlib.util.spec_from_file_location("rb", root / "scripts/build_release_bundle.py")
          rb = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(rb)
          with tempfile.TemporaryDirectory() as tmp:
              tmp_p = pathlib.Path(tmp)
              src = rb.build_source_tree(tmp_p)
              zpath = tmp_p / "source.zip"
              rb.zip_dir(src, zpath)
              unpacked = tmp_p / "unpacked"
              with zipfile.ZipFile(zpath) as zf:
                  zf.extractall(unpacked)
              if (unpacked / ".git").exists():
                  raise RuntimeError("unpacked source archive unexpectedly contains .git")
              # 1. Verify committed latex/ matches fresh typ2tex check
              subprocess.run(
                  ["python3", str(unpacked / "scripts/typ2tex.py"),
                   "--root", str(unpacked), "--outdir", str(unpacked / "latex"), "--check"],
                  cwd=unpacked, check=True,
              )
              # 2. Delete latex/ completely and regenerate + compile both publication paths from scratch
              shutil.rmtree(unpacked / "latex")
              subprocess.run(
                  ["python3", str(unpacked / "scripts/build_publication.py"),
                   "--root", str(unpacked), "--outdir", str(tmp_p / "pub"),
                   "--latex-dir", str(unpacked / "latex"),
                   "--check-registry", "--with-latex"],
                  cwd=unpacked, check=True,
              )
              # 3. Materialize historical baseline without Git and verify parity
              base_dir = tmp_p / "baseline"
              subprocess.run(
                  ["python3", str(unpacked / "scripts/materialize_latex_baseline.py"),
                   "--root", str(unpacked), "--outdir", str(base_dir)],
                  cwd=unpacked, check=True,
              )
              subprocess.run(
                  ["latexmk", "-xelatex", "-interaction=nonstopmode", "-halt-on-error", "main.tex"],
                  cwd=base_dir, check=True,
              )
              subprocess.run(
                  ["latexmk", "-cd", "-xelatex", "-interaction=nonstopmode", "-halt-on-error", "manual/main.tex"],
                  cwd=base_dir, check=True,
              )
              shutil.copy2(base_dir / "manual/main.pdf", base_dir / "manual.pdf")
              subprocess.run(
                  ["python3", str(unpacked / "scripts/verify_typst_parity.py"),
                   "--root", str(unpacked), "--outdir", str(tmp_p / "parity"),
                   "--baseline-root", str(base_dir),
                   "--baseline-main-pdf", str(base_dir / "main.pdf"),
                   "--baseline-manual-pdf", str(base_dir / "manual.pdf"),
                   "--generated-latex-main-pdf", str(tmp_p / "pub/latex/main.pdf"),
                   "--generated-latex-manual-pdf", str(tmp_p / "pub/latex/manual.pdf"),
                   "--skip-negative-controls"],
                  cwd=unpacked, check=True,
              )
          EOF

      - name: Record artifact SHA-256 manifest
        run: |
          (cd dist_typst && sha256sum main.pdf manual.pdf latex/main.pdf latex/manual.pdf build_report.json publication_build_report.json parity_report.json baseline_main.pdf baseline_manual.pdf > SHA256_TYPST.txt)
          cat dist_typst/SHA256_TYPST.txt

      - name: Upload canonical Typst, generated LaTeX, and parity artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aod-typst-phase2
          path: |
            dist_typst/main.pdf
            dist_typst/manual.pdf
            dist_typst/latex/main.pdf
            dist_typst/latex/manual.pdf
            dist_typst/build_report.json
            dist_typst/publication_build_report.json
            dist_typst/parity_report.json
            dist_typst/baseline_main.pdf
            dist_typst/baseline_manual.pdf
            dist_typst/SHA256_TYPST.txt
