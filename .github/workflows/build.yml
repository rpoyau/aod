name: build

on:
  push:
    branches: [ main ]
  pull_request:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TYPST_VERSION: "0.15.1"
      TYPST_TARBALL: "typst-x86_64-unknown-linux-musl.tar.xz"
      TYPST_TARBALL_SHA256: "a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c"
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Typst, fonts, and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-lmodern poppler-utils python3 python3-pip zip unzip
          curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/${TYPST_TARBALL}" -o "/tmp/${TYPST_TARBALL}"
          echo "${TYPST_TARBALL_SHA256}  /tmp/${TYPST_TARBALL}" | sha256sum -c -
          tar -xf "/tmp/${TYPST_TARBALL}" -C /tmp
          mkdir -p "$HOME/.local/bin"
          install -m 755 "/tmp/typst-x86_64-unknown-linux-musl/typst" "$HOME/.local/bin/typst"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/typst" --version
          python3 -m pip install --upgrade pip
          if [ -f requirements-ci.txt ]; then python3 -m pip install -r requirements-ci.txt; fi
          python3 -m pip install pytest sympy pandas matplotlib pypdf

      - name: Build canonical Typst primary PDFs
        run: |
          python3 scripts/build_publication.py --outdir _build/pub --check-registry
          cp _build/pub/main.pdf main.pdf
          cp _build/pub/manual.pdf manual.pdf

      - name: Audit executed scientific sources
        run: |
          python3 scripts/audit_scientific_sources.py .

      - name: Verify S2 zero-float reference engine (normal and -O)
        run: |
          mkdir -p _build/s2
          python3 -B -m manual.engine --verify-all --check-zero-float --verify-vectors --report _build/s2/engine_norm.json
          python3 -B -O -m manual.engine --verify-all --check-zero-float --verify-vectors --report _build/s2/engine_opt.json
          cmp _build/s2/engine_norm.json _build/s2/engine_opt.json

      - name: Run test suite
        run: |
          set -o pipefail
          if [ -d tests ]; then
            pytest -q | tee tests.txt
          else
            echo "pytest: tests directory not present" | tee tests.txt
          fi

      - name: Check Zenodo references
        run: |
          python3 scripts/sync_zenodo_references.py --check

      - name: Build release artifacts
        run: |
          python3 scripts/build_release_bundle.py --outdir dist --tests tests.txt --main main.pdf --manual manual.pdf

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aod-temporal-dynamics
          path: |
            dist/*

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/main.pdf \
            dist/manual.pdf \
            dist/source.zip \
            dist/bundle.zip \
            dist/tests.txt \
            dist/patch_summary.txt \
            dist/BUNDLE_CONTENTS_SHA256.txt \
            dist/SHA256.txt \
            --clobber
