name: Build PDFs and source archive

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  latex:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Install TinyTeX
        shell: bash
        run: |
          set -e
          wget -qO- "https://yihui.org/tinytex/install-bin-unix.sh" | sh
          echo "$HOME/bin" >> $GITHUB_PATH
          export PATH="$HOME/bin:$PATH"
          ~/bin/tlmgr update --self --all
          for pkg in latexmk xetex geometry amsmath amsfonts mathtools microtype enumitem siunitx booktabs pgf hyperref cleveref placeins xcolor fontspec tools; do
            ~/bin/tlmgr install "$pkg"
          done

      - name: Build PDFs
        shell: bash
        run: |
          export PATH="$HOME/bin:$PATH"
          latexmk -xelatex -interaction=nonstopmode -halt-on-error main.tex
          latexmk -xelatex -interaction=nonstopmode -halt-on-error supplement-a.tex
          latexmk -xelatex -interaction=nonstopmode -halt-on-error supplement-b.tex
          latexmk -cd -xelatex -interaction=nonstopmode -halt-on-error supplement-c/main.tex
          cp supplement-c/main.pdf supplement-c.pdf

      - name: Run native verifier
        run: python3 audit_pack/verify_native_examples_sympy.py

      - name: Build source archive
        id: sourcezip
        run: |
          python3 scripts/build_release_bundle.py --tag release --outdir dist --archive-prefix aod-source > /tmp/sourcezip_path.txt
          echo "path=$(cat /tmp/sourcezip_path.txt)" >> $GITHUB_OUTPUT

      - name: Zip native audit pack
        run: |
          cd audit_pack && zip -r ../dist/native-audit-pack.zip .

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: |
            main.pdf
            supplement-a.pdf
            supplement-b.pdf
            supplement-c.pdf

      - name: Upload source zip
        uses: actions/upload-artifact@v4
        with:
          name: source-zip
          path: ${{ steps.sourcezip.outputs.path }}

      - name: Upload native audit pack
        uses: actions/upload-artifact@v4
        with:
          name: native-audit-pack
          path: dist/native-audit-pack.zip
