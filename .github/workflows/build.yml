name: build

on:
  push:
    branches: [ main ]
  pull_request:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-xetex texlive-bibtex-extra texlive-latex-extra python3 python3-pip zip unzip
          python3 -m pip install --upgrade pip
          if [ -f requirements-ci.txt ]; then python3 -m pip install -r requirements-ci.txt; fi
          python3 -m pip install pytest sympy pandas matplotlib

      - name: Build main note
        run: |
          latexmk -xelatex -interaction=nonstopmode -halt-on-error main.tex

      - name: Build manual
        run: |
          latexmk -cd -xelatex -interaction=nonstopmode -halt-on-error manual/main.tex
          cp manual/main.pdf manual.pdf

      - name: Build Manual II Fractal Fusion Scales
        run: |
          latexmk -cd -xelatex -interaction=nonstopmode -halt-on-error manual-2/main.tex
          cp manual-2/main.pdf manual-2.pdf

      - name: Run test suite
        run: |
          set -o pipefail
          if [ -d tests ]; then
            pytest -q | tee tests.txt
          else
            echo "pytest: tests directory not present" | tee tests.txt
          fi

      - name: Check Zenodo references
        run: |
          python3 scripts/sync_zenodo_references.py --check

      - name: Build release artifacts
        run: |
          python3 scripts/build_release_bundle.py --outdir dist --tests tests.txt --main main.pdf --manual manual.pdf --manual2 manual-2.pdf

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aod-temporal-dynamics
          path: dist/*

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/main.pdf \
            dist/manual.pdf \
            dist/manual-2.pdf \
            dist/MANUAL_I_ROADMAP.md \
            dist/MANUAL_II_ROADMAP.md \
            dist/source.zip \
            dist/bundle-${{ github.event.release.tag_name }}.zip \
            dist/bundle.zip \
            dist/tests.txt \
            dist/patch_summary.txt \
            dist/MANUAL_ARTIFACT_BASELINES_SHA256.txt \
            dist/EXTERNAL_PAYLOADS_SHA256.txt \
            dist/BUNDLE_CONTENTS_SHA256.txt \
            dist/SHA256.txt \
            --clobber
